<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13213f">
<title>Boggle board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#13213f; --bg2:#0e1931; --tray:#2a4c9b; --tray-edge:#1c3678;
  --die:#f4efe1; --die-shade:#d9d1bb; --ink:#1d1a16;
  --amber:#ffc23d; --warn:#ff6b57; --text:#e9edf7; --muted:#9fb0d6;
  --font:"Futura","Avenir Next","Trebuchet MS","Helvetica Neue",Arial,sans-serif;
  --tray-size:min(92vw, calc(100vh - 170px), 780px);
}
@supports (height:100dvh){ :root{ --tray-size:min(92vw, calc(100dvh - 170px), 780px); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 40%, #1b2d55 0%, var(--bg) 55%, var(--bg2) 100%);
  background-color:var(--bg);
  color:var(--text);font-family:var(--font);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:manipulation;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ---------- Setup ---------- */
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#setup{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px 20px 32px}
.title-dice{display:flex;gap:min(2.4vw,14px)}
.title-dice .die{width:min(13vw,92px);height:min(13vw,92px);font-size:min(8vw,56px)}
.title-dice .die:nth-child(odd){transform:rotate(-4deg)}
.title-dice .die:nth-child(even){transform:rotate(3deg) translateY(4px)}
.controls{width:min(560px,100%);display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.row > span{font-size:20px;color:var(--muted);letter-spacing:.02em}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:12px 18px;border-radius:10px;font-size:18px;color:var(--muted);min-height:48px}
.seg button[aria-pressed="true"]{background:var(--die);color:var(--ink);font-weight:700}
.stepper{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:14px;padding:4px}
.stepper button{width:52px;height:48px;border:0;border-radius:10px;background:rgba(255,255,255,.08);font-size:26px;line-height:1}
.stepper output{min-width:84px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.primary{margin-top:14px;border:0;border-radius:16px;background:var(--amber);color:#2a1d00;font-size:24px;font-weight:700;padding:20px;min-height:64px;box-shadow:0 6px 0 #b9851a}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b9851a}

/* ---------- Play ---------- */
.bar{width:100%;max-width:820px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 16px;min-height:76px}
.bar .center{justify-self:center}
.bar:empty{display:none}
.bar .left{justify-self:start;display:flex;gap:8px}
.bar .right{justify-self:end;display:flex;gap:8px}
.ghost{border:1px solid rgba(233,237,247,.25);background:transparent;border-radius:12px;padding:10px 16px;font-size:17px;min-height:48px}
.ghost.strong{background:var(--die);color:var(--ink);border-color:var(--die);font-weight:700}
#clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;border:0;background:none;padding:0 8px}
#clock.warn{color:var(--amber)}
#clock.crit{color:var(--warn)}
#clock.done{font-size:26px;color:var(--muted)}
.tabs{display:flex;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:10px 18px;border-radius:10px;font-size:18px;color:var(--muted);min-height:44px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--die);color:var(--ink);font-weight:700}

.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:0 12px 16px;min-height:0}
.tray{
  position:relative;width:var(--tray-size);height:var(--tray-size);
  background:linear-gradient(160deg,#3560b8,var(--tray) 45%,var(--tray-edge));
  border-radius:calc(var(--tray-size)*.05);
  padding:calc(var(--tray-size)*.035);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -6px 14px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
}
#grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:calc(var(--tray-size)*.03)}
.die{
  position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fffdf6 0%,var(--die) 40%,var(--die-shade) 100%);
  border-radius:16%;color:var(--ink);font-weight:700;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.8),0 4px 6px rgba(0,0,0,.35);
}
#grid .die{font-size:calc(var(--tray-size)*.13)}
.face{display:flex;flex-direction:column;align-items:center;line-height:1;transition:transform .25s}
.face .ch{display:block}
.face.qu .ch{font-size:.8em;letter-spacing:-.02em}
.face.ul .ch{border-bottom:.07em solid currentColor;padding-bottom:.02em}
.cover{position:absolute;inset:0;border-radius:inherit;background:var(--tray-edge);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--text)}
.rolling .face{filter:blur(1px)}

/* ---------- Word list ---------- */
#wordsView{flex:1;width:100%;max-width:820px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 32px;min-height:0}
#wordsView p{color:var(--muted);font-size:16px;margin:4px 0 16px}
.saved-note{color:var(--muted);font-size:15px;margin:2px 0 0;text-align:center}
#wordList{list-style:none;margin:0;padding:0;columns:4 150px;column-gap:20px}
#wordList li{break-inside:avoid}
#wordList button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 4px;font-size:19px;letter-spacing:.03em;border-radius:6px}
#wordList button:active{background:rgba(255,255,255,.1)}

/* ---------- Word popover ---------- */
#pop{position:fixed;z-index:20;width:min(340px,calc(100vw - 24px));background:#fbf8ef;color:var(--ink);border-radius:18px;padding:16px 16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55);-webkit-user-select:text;user-select:text}
#pop .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
#pop .w{font-size:26px;font-weight:700;letter-spacing:.06em}
#pop .x{border:0;background:rgba(0,0,0,.07);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink)}
#pop svg{display:block;width:170px;height:170px;margin:0 auto 14px}
#pop .def{font-size:16px;line-height:1.45;margin:0;color:#3a352c}
#pop .def .lead{color:#7a6f5c}
.credit{max-width:560px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted);opacity:.8;margin:0}

@media (prefers-reduced-motion:reduce){.face{transition:none}}
@media (max-width:560px){#clock{font-size:36px}.ghost{padding:8px 12px;font-size:15px}.tabs button{padding:8px 12px;font-size:16px}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="left">
      <nav class="tabs" id="tabs" role="tablist" hidden>
        <button role="tab" data-tab="settings" aria-selected="true">Settings</button>
        <button role="tab" data-tab="board" aria-selected="false" id="boardTab">Board</button>
        <button role="tab" data-tab="words" aria-selected="false" id="wordsTab">Words</button>
      </nav>
    </div>
    <div class="center"><button id="clock" aria-live="off" hidden></button></div>
    <div class="right">
      <button class="ghost" id="pauseBtn" hidden>Pause</button>
      <button class="ghost strong" id="endBtn" hidden>End round</button>
      <button class="ghost strong" id="againBtn" hidden>Shake again</button>
    </div>
  </header>

  <main id="setup">
  <div class="title-dice" aria-label="Boggle">
    <div class="die"><span class="face"><span class="ch">B</span></span></div>
    <div class="die"><span class="face"><span class="ch">O</span></span></div>
    <div class="die"><span class="face"><span class="ch">G</span></span></div>
    <div class="die"><span class="face"><span class="ch">G</span></span></div>
    <div class="die"><span class="face"><span class="ch">L</span></span></div>
    <div class="die"><span class="face"><span class="ch">E</span></span></div>
  </div>
  <section class="controls">
    <div class="row">
      <span>Timer</span>
      <div class="seg" id="segTimed">
        <button data-v="0">Untimed</button>
        <button data-v="1">Timed</button>
      </div>
    </div>
    <div class="row" id="timeRow">
      <span>Round length</span>
      <div class="stepper">
        <button id="minus" aria-label="Shorter">−</button>
        <output id="timeOut">3:00</output>
        <button id="plus" aria-label="Longer">+</button>
      </div>
    </div>
    <div class="row">
      <span>Letters</span>
      <div class="seg" id="segOrient">
        <button data-v="fixed">Fixed</button>
        <button data-v="random">Randomized</button>
      </div>
    </div>
    <button class="primary" id="start">Shake the dice</button>
    <p class="saved-note" id="savedNote" hidden></p>
  </section>
  <p class="credit">Word list and definitions from Wiktionary (CC BY-SA 4.0), extracted by Wiktextract / kaikki.org.<br>Gzip decoding by fflate (MIT). Not affiliated with Hasbro.</p>
  </main>

  <div class="stage" id="boardView" hidden>
    <div class="tray" id="tray">
      <div id="grid"></div>
      <div class="cover" id="pauseCover" hidden>Paused — tap the clock to resume</div>
    </div>
  </div>
  <div id="pop" role="dialog" aria-modal="false" hidden>
    <div class="head"><span class="w" id="popWord"></span><button class="x" id="popClose" aria-label="Close">×</button></div>
    <svg id="popBoard" viewBox="0 0 170 170" aria-hidden="true"></svg>
    <p class="def" id="popDef"></p>
  </div>
  <div id="wordsView" hidden>
    <p id="wordHint"></p>
    <ul id="wordList"></ul>
  </div>
</div>

function rnd(n){
  if (window.crypto && crypto.getRandomValues){
    var b = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(b); } while (b[0] >= lim);
    return b[0] % n;
  }
  return Math.floor(Math.random() * n);
}

/* ===== Settings (remembered if the browser allows) ===== */
var settings = { timed: true, seconds: 180, orient: "fixed" };
try { var saved = JSON.parse(localStorage.getItem("boggle-settings")); if (saved) settings = Object.assign(settings, saved); } catch(e){}
function saveSettings(){ try { localStorage.setItem("boggle-settings", JSON.stringify(settings)); } catch(e){} }

var $ = function(id){ return document.getElementById(id); };
function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }

function renderSetup(){
  [].forEach.call($("segTimed").children, function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === (settings.timed?"1":"0"))); });
  [].forEach.call($("segOrient").children, function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === settings.orient)); });
  $("timeRow").hidden = !settings.timed;
  $("timeOut").textContent = fmt(settings.seconds);
}
$("segTimed").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; settings.timed = b.dataset.v==="1"; saveSettings(); renderSetup(); });
$("segOrient").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; settings.orient = b.dataset.v; saveSettings(); renderSetup(); });
$("minus").addEventListener("click", function(){ settings.seconds = Math.max(30, settings.seconds - 30); saveSettings(); renderSetup(); });
$("plus").addEventListener("click", function(){ settings.seconds = Math.min(1200, settings.seconds + 30); saveSettings(); renderSetup(); });

/* ===== Last board: saved on every roll (overwriting the previous one) =====
   Kept in the browser's local storage, which has no expiry date. (Cookies set by a page are
   limited to 7 days in Safari, so they can't do this.) */
var SAVE_KEY = "boggle-last-board";
function saveBoard(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, at: Date.now(), orient: boardOrient,
      cells: board.map(function(c){ return [c.letter, c.rot]; }) }));
  } catch(e){}
  updateSavedNote(Date.now());
}
function updateSavedNote(at){
  var d = new Date(at);
  $("savedNote").textContent = "Last board (" + d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
    d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + ") is under the Board and Words tabs.";
  $("savedNote").hidden = false;
}
function loadSavedBoard(){
  try {
    var d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !d.cells || d.cells.length !== 16) return null;
    return d;
  } catch(e){ return null; }
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

/* ===== Board ===== */
var board = [], boardOrient = "fixed"; // board: [{letter:"A"|"Qu", rot:0..3}]
function shake(){
  var order = DICE.slice();
  for (var i = order.length - 1; i > 0; i--){ var j = rnd(i+1); var t = order[i]; order[i] = order[j]; order[j] = t; }
  board = order.map(function(die){
    var f = die[rnd(6)];
    return { letter: f === "Q" ? "Qu" : f, rot: settings.orient === "random" ? rnd(4) : 0 };
  });
  boardOrient = settings.orient;
  saveBoard();
}
function faceHTML(cell){
  var cls = "face";
  if (cell.letter === "Qu") cls += " qu";
  if (boardOrient === "random" && AMBIG[cell.letter]) cls += " ul";
  return '<span class="'+cls+'" style="transform:rotate('+(cell.rot*90)+'deg)"><span class="ch">'+cell.letter+'</span></span>';
}
function drawGrid(){
  var g = $("grid"), h = "";
  for (var i = 0; i < 16; i++) h += '<div class="die" data-i="'+i+'">'+faceHTML(board[i])+'</div>';
  g.innerHTML = h;
}
function rollAnimation(done){
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ drawGrid(); done(); return; }
  var g = $("grid"), ticks = 0;
  g.classList.add("rolling");
  (function step(){
    var h = "";
    for (var i = 0; i < 16; i++){
      var d = DICE[rnd(16)], f = d[rnd(6)];
      h += '<div class="die">'+faceHTML({letter: f==="Q"?"Qu":f, rot: settings.orient==="random"?rnd(4):0})+'</div>';
    }
    g.innerHTML = h;
    if (++ticks < 9) setTimeout(step, 70);
    else { g.classList.remove("rolling"); drawGrid(); done(); }
  })();
}

/* ===== Solver (standard rules: 3+ letters, adjacent incl. diagonals, each die once, Qu = 2 letters) ===== */
function solve(){
  var W = WORDS;
  var letters = board.map(function(c){ return c.letter.toLowerCase(); });
  var adj = [];
  for (var i = 0; i < 16; i++){
    var r = i>>2, c = i&3, list = [];
    for (var dr=-1; dr<=1; dr++) for (var dc=-1; dc<=1; dc++){
      if (!dr && !dc) continue;
      var rr=r+dr, cc=c+dc;
      if (rr>=0 && rr<4 && cc>=0 && cc<4) list.push(rr*4+cc);
    }
    adj.push(list);
  }
  var found = new Map(), used = new Array(16).fill(false), path = [];
  function dfs(i, prefix){
    var s = prefix + letters[i];
    var k = lowerBound(W, s);
    if (k >= W.length || W[k].lastIndexOf(s, 0) !== 0) return;
    used[i] = true; path.push(i);
    if (s.length >= 3 && W[k] === s && !found.has(s)) found.set(s, path.slice());
    var a = adj[i];
    for (var n = 0; n < a.length; n++) if (!used[a[n]]) dfs(a[n], s);
    used[i] = false; path.pop();
  }
  for (var i = 0; i < 16; i++) dfs(i, "");
  return found;
}

/* ===== Word popover: mini board with path + definition (main board is never touched) ===== */
function miniBoardSVG(path){
  var S = 170, pad = 8, gap = 6, cell = (S - pad*2 - gap*3) / 4, h = "";
  function cx(i){ return pad + (i & 3) * (cell + gap) + cell/2; }
  function cy(i){ return pad + (i >> 2) * (cell + gap) + cell/2; }
  var on = {}; path.forEach(function(idx, n){ on[idx] = n + 1; });
  h += '<rect x="0" y="0" width="'+S+'" height="'+S+'" rx="14" fill="#2a4c9b"/>';
  for (var i = 0; i < 16; i++){
    var x = pad + (i & 3) * (cell + gap), y = pad + (i >> 2) * (cell + gap), L = board[i].letter;
    h += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="7" fill="'+(on[i] ? '#ffd772' : '#f4efe1')+'"/>';
    h += '<text x="'+(x+cell/2)+'" y="'+(y+cell/2+1)+'" text-anchor="middle" dominant-baseline="central" font-family="Futura,Avenir Next,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="'+(L === "Qu" ? 17 : 21)+'" fill="'+(on[i] ? '#1d1a16' : '#8d8676')+'">'+L+'</text>';
  }
  var pts = path.map(function(i){ return cx(i).toFixed(1) + "," + cy(i).toFixed(1); }).join(" ");
  h += '<polyline points="'+pts+'" fill="none" stroke="#c0392b" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
  path.forEach(function(idx, n){
    var x = pad + (idx & 3) * (cell + gap), y = pad + (idx >> 2) * (cell + gap);
    h += '<text x="'+(x+5)+'" y="'+(y+11)+'" font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="700" fill="#7a5a00">'+(n+1)+'</text>';
  });
  return h;
}
var popFor = null, popScroll = 0;
function openPop(btn, w){
  var pop = $("pop");
  popFor = btn;
  popScroll = $("wordsView").scrollTop;
  $("popWord").textContent = w.toUpperCase();
  $("popBoard").innerHTML = miniBoardSVG(results.get(w));
  var d = definition(w, 0), el = $("popDef");
  el.textContent = "";
  if (d && d.lead){ var s = document.createElement("span"); s.className = "lead"; s.textContent = d.lead + (d.text ? " — " : ""); el.appendChild(s); }
  el.appendChild(document.createTextNode(d ? d.text : ""));
  if (!d || (!d.lead && !d.text)) el.textContent = "No definition available.";
  pop.hidden = false;
  // place next to the tapped word, flipping above if there's no room below, clamped to the screen
  var r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, vw = innerWidth, vh = innerHeight, m = 12;
  var left = Math.min(Math.max(m, r.left), vw - pw - m);
  var top = r.bottom + 8;
  if (top + ph > vh - m) top = r.top - ph - 8;
  if (top < m) top = Math.max(m, (vh - ph) / 2);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function closePop(){ $("pop").hidden = true; popFor = null; }

/* ===== Timer, sound, screen wake ===== */
var timer = { endAt: 0, remaining: 0, running: false, iv: null };
var audioCtx = null, wakeLock = null;
function unlockAudio(){
  try {
    if (!audioCtx){ var AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (audioCtx){ var b = audioCtx.createBuffer(1,1,22050), s = audioCtx.createBufferSource(); s.buffer=b; s.connect(audioCtx.destination); s.start(0); }
  } catch(e){}
}
function beep(freq, at, dur){
  if (!audioCtx) return;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + at;
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
}
function buzzer(){ beep(660,0,.35); beep(660,.45,.35); beep(440,.9,.9); }
function requestWake(){
  try { if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; }).catch(function(){}); } catch(e){}
}
function releaseWake(){ try { if (wakeLock) wakeLock.release(); } catch(e){} wakeLock = null; }
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible"){ if (phase === "play") requestWake(); tick(); }
});

function startClock(){
  timer.remaining = settings.seconds; timer.endAt = Date.now() + timer.remaining*1000; timer.running = true;
  clearInterval(timer.iv); timer.iv = setInterval(tick, 200); tick();
}
function tick(){
  if (phase !== "play" || !settings.timed) return;
  if (timer.running) timer.remaining = (timer.endAt - Date.now())/1000;
  var c = $("clock");
  c.textContent = fmt(timer.remaining);
  c.className = timer.remaining <= 10 ? "crit" : timer.remaining <= 30 ? "warn" : "";
  if (timer.remaining <= 0){ buzzer(); endRound(true); }
}
function togglePause(){
  if (phase !== "play" || !settings.timed) return;
  if (timer.running){ timer.remaining = (timer.endAt - Date.now())/1000; timer.running = false; }
  else { timer.endAt = Date.now() + timer.remaining*1000; timer.running = true; unlockAudio(); }
  $("pauseCover").hidden = timer.running;
  $("pauseBtn").textContent = timer.running ? "Pause" : "Resume";
  tick();
}

/* ===== Flow =====
   phase: "idle" (nothing rolled yet), "rolling", "play" (round in progress), "results" (round over)
   view:  "settings", "board", "words" */
var phase = "idle", view = "settings", results = null;

function render(){
  var hasBoard = board.length === 16, live = phase === "play" || phase === "rolling";
  $("tabs").hidden = !hasBoard;
  $("boardTab").hidden = !hasBoard;
  $("wordsTab").hidden = !hasBoard || live;          // no peeking at answers mid-round
  [].forEach.call($("tabs").children, function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === view)); });
  $("setup").hidden = view !== "settings";
  $("boardView").hidden = view !== "board";
  $("wordsView").hidden = view !== "words";
  $("clock").hidden = !(live && settings.timed && view === "board");
  $("pauseBtn").hidden = !(phase === "play" && settings.timed && view === "board");
  $("endBtn").hidden = !(live && view === "board");
  $("againBtn").hidden = !(phase === "results" && view !== "settings");
  if (view === "settings") renderSetup();
}
function setView(v){ closePop(); view = v; render(); }

function startRound(){
  closePop();
  unlockAudio(); requestWake();
  phase = "rolling"; results = null; view = "board";
  $("clock").className = ""; $("clock").textContent = settings.timed ? fmt(settings.seconds) : "";
  $("pauseBtn").textContent = "Pause"; $("pauseCover").hidden = true;
  shake();
  render();
  rollAnimation(function(){ phase = "play"; render(); if (settings.timed) startClock(); });
  loadDict().catch(function(){}); // make sure the dictionary is ready by the end of the round
}
function endRound(timeUp){
  phase = "results"; timer.running = false; clearInterval(timer.iv); releaseWake();
  $("pauseCover").hidden = true;
  render();
  showResults();
}
function showResults(){
  results = null;
  $("wordsTab").textContent = "Words (…)";
  $("wordHint").textContent = "Loading dictionary…";
  $("wordList").innerHTML = "";
  var forBoard = board;
  loadDict().then(function(){
    if (board !== forBoard) return; // a new roll happened meanwhile
    results = solve();
    var words = Array.from(results.keys()).sort();
    $("wordsTab").textContent = "Words (" + words.length + ")";
    $("wordList").innerHTML = words.map(function(w){
      return '<li><button data-w="'+w+'">'+w.toUpperCase()+'</button></li>';
    }).join("");
    $("wordHint").textContent = words.length ? "Tap a word to see its path and definition." : "No words found on this board.";
  }, function(err){
    $("wordsTab").textContent = "Words";
    $("wordHint").textContent = location.protocol === "file:"
      ? "The dictionary can't load when this page is opened as a local file. Open it from its website instead."
      : "The dictionary couldn't load (" + (err && err.message || "network error") + "). Check your connection and reopen the Words tab.";
  });
}

$("start").addEventListener("click", startRound);
$("againBtn").addEventListener("click", startRound);
$("endBtn").addEventListener("click", function(){ if (phase === "play") endRound(false); });
$("pauseBtn").addEventListener("click", togglePause);
$("clock").addEventListener("click", togglePause);
$("pauseCover").addEventListener("click", togglePause);
$("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b || b.dataset.tab === view) return;
  if ((phase === "play" || phase === "rolling") && b.dataset.tab === "settings"){
    if (!confirm("End this round and go to settings?")) return;
    if (phase === "rolling") return;
    endRound(false);
  }
  if (b.dataset.tab === "words" && phase === "results" && !results && !dictPromise) showResults(); // retry after a failed load
  setView(b.dataset.tab);
});
$("wordList").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b || !results) return;
  e.stopPropagation();
  if (popFor === b) { closePop(); return; }
  openPop(b, b.dataset.w);
});
$("popClose").addEventListener("click", closePop);
$("pop").addEventListener("click", function(e){ e.stopPropagation(); });
document.addEventListener("click", function(){ if (!$("pop").hidden) closePop(); });
$("wordsView").addEventListener("scroll", function(){
  // close once the list has really moved, so the popover never floats over the wrong word
  if (!$("pop").hidden && Math.abs($("wordsView").scrollTop - popScroll) > 24) closePop();
}, { passive: true });
window.addEventListener("resize", closePop);
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

/* ===== Start-up: settings first; the last board (if any) waits behind the Board and Words tabs ===== */
(function(){
  var saved = loadSavedBoard();
  if (saved){
    board = saved.cells.map(function(c){ return { letter: c[0], rot: c[1] }; });
    boardOrient = saved.orient === "random" ? "random" : "fixed";
    drawGrid();
    phase = "results";
    updateSavedNote(saved.at);
    showResults();
  }
  render();
  loadDict().catch(function(){});
})();

/* ===== Offline support: cache the page and dictionary on the device (needs https, e.g. GitHub Pages) ===== */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
